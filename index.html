<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Compression_Unit · Demien Rapp</title>
    <script>
        // eingebettet auf rappde.com/tools? dann ohne titelzeile und credit
        try { if (window.self !== window.top) document.documentElement.classList.add('is-embedded'); } catch (e) { document.documentElement.classList.add('is-embedded'); }
    </script>

    <!-- MANUAL: self-hosted verlangt. Beim Deploy dieses CDN gegen eigene @font-face tauschen. -->

    <style>
        @font-face {
            font-family: "Endless";
            src: url("fonts/Endless.ttf") format("truetype");
            font-display: swap;
        }

        :root {
            --paper: #fff;
            --ink: #000;
            --muted: #595959;
            --soft: #ddd;
            --stage: #000;
            --link: #00e;
            --stroke: 3px;
            --line: 24px;
            --half: 12px;
            --gap: 24px;
            --touch: 44px;
            --controls: 300px;
        }
        @media (max-width: 1023px) { :root { --gap: 18px; } }
        @media (max-width: 767px)  { :root { --gap: 12px; } }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html { background: var(--paper); }
        body {
            margin: 0;
            padding: var(--gap);
            background: var(--paper);
            color: var(--ink);
            font-family: "Endless", Arial, Helvetica, sans-serif;
            font-size: 20px;
            line-height: var(--line);
            -webkit-font-smoothing: none;
        }

        /* titelzeile, nur wenn das tool allein offen ist */
        .topbar {
            border-bottom: var(--stroke) solid var(--ink);
            padding-bottom: var(--half);
            margin-bottom: var(--line);
        }
        .brand {
            margin: 0;
            font-size: 48px;
            line-height: 48px;
            font-weight: 400;
            text-transform: uppercase;
            overflow-wrap: anywhere;
        }
        @media (max-width: 767px) { .brand { font-size: 32px; line-height: 36px; } }

        .container {
            display: grid;
            grid-template-columns: minmax(0, 1fr) var(--controls);
            gap: var(--gap);
            align-items: start;
        }

        /* buehne */
        .viewport {
            position: sticky;
            top: var(--gap);
            background: var(--stage);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 280px;
            overflow: hidden;
        }
        canvas {
            display: block;
            max-width: 100%;
            height: auto;
            max-height: calc(100vh - var(--gap) * 2);
            image-rendering: pixelated;
        }

        .crt-active::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, .25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        .rec-indicator {
            position: absolute;
            top: var(--half);
            right: var(--half);
            display: none;
            align-items: center;
            gap: 8px;
            z-index: 20;
            background: var(--ink);
            color: var(--paper);
            font-size: 12px;
            line-height: 16px;
            letter-spacing: .12em;
            padding: 4px 8px;
        }
        .rec-indicator::before {
            content: "";
            width: 10px;
            height: 10px;
            background: var(--paper);
            animation: blink 1s steps(1) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        @media (prefers-reduced-motion: reduce) { .rec-indicator::before { animation: none; } }

        /* regler */
        .controls {
            border-left: var(--stroke) solid var(--ink);
            padding-left: var(--gap);
            display: flex;
            flex-direction: column;
            gap: var(--line);
        }

        .eyebrow {
            margin: 0 0 var(--half);
            font-size: 14px;
            line-height: 20px;
            font-weight: 400;
            letter-spacing: .1em;
            text-transform: uppercase;
            border-bottom: var(--stroke) solid var(--ink);
            padding-bottom: var(--half);
        }
        .hint { margin: var(--half) 0 0; font-size: 16px; line-height: var(--line); color: var(--muted); }

        .control-item { display: flex; flex-direction: column; }
        .control-item + .control-item { margin-top: var(--half); }
        .control-header {
            display: flex;
            justify-content: space-between;
            gap: var(--half);
            font-size: 12px;
            line-height: 16px;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .control-header .val { color: var(--ink); font-variant-numeric: tabular-nums; }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            display: block;
            width: 100%;
            height: var(--touch);
            margin: 0;
            background: transparent;
            cursor: pointer;
            touch-action: pan-y;
        }
        input[type="range"]::-webkit-slider-runnable-track { height: 3px; background: var(--soft); }
        input[type="range"]::-moz-range-track { height: 3px; background: var(--soft); }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            margin-top: -10.5px;
            background: var(--ink);
            border: 0;
            border-radius: 0;
        }
        input[type="range"]::-moz-range-thumb { width: 24px; height: 24px; background: var(--ink); border: 0; border-radius: 0; }
        input[type="range"]:focus-visible { outline: var(--stroke) solid var(--ink); outline-offset: 3px; }

        .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button, .file-label {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: var(--touch);
            padding: 8px 12px;
            margin: 0;
            font: inherit;
            font-size: 14px;
            line-height: 20px;
            letter-spacing: .1em;
            text-transform: uppercase;
            background: var(--paper);
            color: var(--ink);
            border: var(--stroke) solid var(--ink);
            border-radius: 0;
            cursor: pointer;
            position: relative;
        }
        button:hover, .file-label:hover, button.active, button.recording { background: var(--ink); color: var(--paper); }
        button:focus-visible, .file-label:focus-within { outline: var(--stroke) solid var(--ink); outline-offset: 3px; }
        button:disabled { opacity: .35; cursor: not-allowed; }
        button:disabled:hover { background: var(--paper); color: var(--ink); }
        .full-width { grid-column: 1 / -1; }

        /* file-input nicht display:none, sonst per tab nicht erreichbar */
        .file-label input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }

        footer { margin: 0; font-size: 16px; line-height: var(--line); color: var(--muted); }
        footer a { color: var(--link); }

        @media (max-width: 899px) {
            .container { grid-template-columns: 1fr; }
            .viewport { position: relative; top: 0; }
            canvas { max-height: 50vh; }
            .controls { border-left: 0; padding-left: 0; border-top: var(--stroke) solid var(--ink); padding-top: var(--line); }
        }

        /* eingebettet auf rappde.com/tools: der name steht dort schon, das tool fuellt das iframe */
        .is-embedded .topbar, .is-embedded footer { display: none; }
        .is-embedded body { padding: 0; }
        @media (min-width: 900px) {
            .is-embedded, .is-embedded body { height: 100%; }
            .is-embedded body { overflow: hidden; }
            .is-embedded .container { height: 100%; align-items: stretch; }
            .is-embedded .viewport { position: relative; top: 0; }
            .is-embedded canvas { max-height: 100%; }
            .is-embedded .controls { overflow: auto; }
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <h1 class="brand">Compression_Unit</h1>
    </div>
</header>

<main class="container">
    <!-- LINKS: BILD -->
    <section class="viewport" id="viewport">
        <div id="rec-ui" class="rec-indicator">REC</div>
        <canvas id="output-canvas"></canvas>
    </section>

    <!-- RECHTS: PARAMETER -->
    <aside class="controls">
        <div>
            <h2 class="eyebrow">Source</h2>
            <div class="button-group">
                <label class="file-label">
                    Import source
                    <input type="file" id="file-input" accept="image/*,video/*">
                </label>
                <button id="btn-webcam">Live_Cam</button>
                <button id="btn-crt" class="full-width">CRT_Filter</button>
            </div>
                <p class="hint">Uses your camera on request. Nothing leaves your browser.</p>
        </div>

        <div>
            <h2 class="eyebrow">Signal</h2>
            <div class="control-item">
                <div class="control-header"><span>Compression</span><span class="val" id="v-q">30</span></div>
                <input type="range" id="s-q" min="1" max="100" value="30" aria-label="Compression">
            </div>
            <div class="control-item">
                <div class="control-header"><span>Resolution</span><span class="val" id="v-r">0.50</span></div>
                <input type="range" id="s-r" min="0.01" max="1" step="0.01" value="0.50" aria-label="Resolution">
            </div>
            <div class="control-item">
                <div class="control-header"><span>RGB_Offset</span><span class="val" id="v-shift">0</span></div>
                <input type="range" id="s-shift" min="0" max="20" step="0.5" value="0" aria-label="RGB Offset">
            </div>
            <div class="control-item">
                <div class="control-header"><span>Static_Noise</span><span class="val" id="v-n">0</span></div>
                <input type="range" id="s-n" min="0" max="60" value="0" aria-label="Static Noise">
            </div>
        </div>

        <div>
            <h2 class="eyebrow">Color</h2>
            <div class="control-item">
                <div class="control-header"><span>Contrast</span><span class="val" id="v-c">1.0</span></div>
                <input type="range" id="s-c" min="0.5" max="2.5" step="0.05" value="1.0" aria-label="Contrast">
            </div>
            <div class="control-item">
                <div class="control-header"><span>Saturation</span><span class="val" id="v-s">1.0</span></div>
                <input type="range" id="s-s" min="0" max="3" step="0.05" value="1.0" aria-label="Saturation">
            </div>
        </div>

        <div>
            <h2 class="eyebrow">Output</h2>
            <div class="button-group">
                <button id="btn-save">Save still (JPG)</button>
                <button id="btn-rec">Record video</button>
            </div>
        </div>
    </aside>

    <footer>Made by <a href="https://rappde.com">rappde.com</a></footer>
</main>

<video id="hidden-video" autoplay muted loop playsinline style="display:none"></video>

<script>
    const canvas = document.getElementById('output-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const video = document.getElementById('hidden-video');
    const fileInput = document.getElementById('file-input');
    const btnWebcam = document.getElementById('btn-webcam');
    const btnRec = document.getElementById('btn-rec');

    // captureStream fehlt z.B. auf iOS Safari -> Aufnahme dort ehrlich deaktivieren
    const recSupported = typeof canvas.captureStream === 'function' && typeof window.MediaRecorder === 'function';
    if (!recSupported) {
        btnRec.disabled = true;
        btnRec.textContent = 'Rec n/a';
    }

    // Mobil weniger interne Auflösung -> spürbar flüssiger bei gleichem Look
    const RES_LIMIT = (window.matchMedia('(pointer: coarse)').matches
        || window.matchMedia('(max-width: 900px)').matches) ? 720 : 1200;

    const sliders = {
        q: document.getElementById('s-q'),
        r: document.getElementById('s-r'),
        shift: document.getElementById('s-shift'),
        n: document.getElementById('s-n'),
        c: document.getElementById('s-c'),
        s: document.getElementById('s-s')
    };

    let sourceMode = 'none';
    let isProcessing = false;
    let currentImage = null;
    let currentURL = null;     // aktive blob-url, wird beim naechsten import revoked
    let stream = null;
    let mediaRecorder, recordedChunks = [];

    // Kleiner Scratch-Canvas: Downscale + Noise + JPEG-Encode
    const tempCanvas = document.createElement('canvas');
    const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });

    // Scratch-Canvas für Kanal-Versatz (chromatische Aberration)
    const rgbCanvas = document.createElement('canvas');
    const rgbCtx = rgbCanvas.getContext('2d');

    function initDim(w, h) {
        // laengere kante limitieren, sonst sprengt ein panorama den speicher
        const scale = Math.min(1, RES_LIMIT / Math.max(w, h));
        canvas.width = Math.floor(w * scale);
        canvas.height = Math.floor(h * scale);
    }

    // leerer zustand und meldungen: weiss auf der schwarzen buehne
    function drawPlaceholder(text = 'NO INPUT') {
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        let fs = Math.max(14, Math.round(canvas.width * 0.035));
        ctx.font = fs + 'px Endless, Arial, sans-serif';
        while (fs > 10 && ctx.measureText(text).width > canvas.width * 0.9) { fs--; ctx.font = fs + 'px Endless, Arial, sans-serif'; }
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);
    }

    function stopStream() {
        if (!stream) return;
        stream.getTracks().forEach(t => t.stop());
        stream = null;
        video.srcObject = null;
        btnWebcam.classList.remove('active');
        btnWebcam.textContent = 'Live_Cam';
    }

    // Blob -> dekodiertes Bild. createImageBitmap ist schneller und braucht keine ObjectURL.
    function decodeBlob(blob) {
        if (window.createImageBitmap) return createImageBitmap(blob);
        return new Promise((res, rej) => {
            const img = new Image();
            const u = URL.createObjectURL(blob);
            img.onload = () => { URL.revokeObjectURL(u); res(img); };
            img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('decode')); };
            img.src = u;
        });
    }

    fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        stopStream();
        if (currentURL) URL.revokeObjectURL(currentURL);   // alte quelle freigeben
        currentURL = URL.createObjectURL(file);
        if (file.type.startsWith('video/')) {
            sourceMode = 'video';
            video.srcObject = null;
            video.src = currentURL;
            video.onloadedmetadata = () => { initDim(video.videoWidth, video.videoHeight); video.play(); };
        } else {
            sourceMode = 'image';
            const img = new Image();
            img.onload = () => { currentImage = img; initDim(img.width, img.height); apply(); };
            img.src = currentURL;
        }
    };

    btnWebcam.onclick = async function() {
        if (stream) {
            stopStream();
            sourceMode = 'none';
            drawPlaceholder();
            return;
        }
        try {
            // Mobil: Rückkamera bevorzugen. Desktop nimmt die einzige Cam.
            stream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 1280 }, facingMode: { ideal: 'environment' } }
            });
            video.src = '';                                 // alte datei-quelle loesen
            video.srcObject = stream;
            sourceMode = 'webcam';
            this.classList.add('active');
            this.textContent = 'Live_Cam';
            video.onloadedmetadata = () => { initDim(video.videoWidth, video.videoHeight); video.play(); };
        } catch (e) {
            drawPlaceholder('Camera blocked. Allow it or import a file.');
        }
    };

    document.getElementById('btn-crt').onclick = function() {
        const active = document.getElementById('viewport').classList.toggle('crt-active');
        this.textContent = 'CRT_Filter';
        this.classList.toggle('active');
    };

    function apply() {
        if (isProcessing || sourceMode === 'none') return;
        if (sourceMode === 'image' && !currentImage) return;
        isProcessing = true;

        const q = sliders.q.value / 100;
        const r = parseFloat(sliders.r.value);
        const noise = parseInt(sliders.n.value);

        const tw = Math.max(1, Math.round(canvas.width * r));
        const th = Math.max(1, Math.round(canvas.height * r));
        tempCanvas.width = tw;
        tempCanvas.height = th;

        tempCtx.filter = `contrast(${sliders.c.value}) saturate(${sliders.s.value})`;
        tempCtx.drawImage(sourceMode === 'image' ? currentImage : video, 0, 0, tw, th);
        tempCtx.filter = 'none';

        // Noise auf dem kleinen Canvas VOR der Kompression. Schnell, JPEG frisst es mit.
        if (noise > 0) {
            const idata = tempCtx.getImageData(0, 0, tw, th);
            const d = idata.data;
            for (let i = 0; i < d.length; i += 4) {
                const v = (Math.random() - 0.5) * noise;
                d[i] += v; d[i + 1] += v; d[i + 2] += v;
            }
            tempCtx.putImageData(idata, 0, 0);
        }

        tempCanvas.toBlob((blob) => {
            if (!blob) { isProcessing = false; return; }
            decodeBlob(blob).then(bmp => {
                drawFinal(bmp);
                if (bmp.close) bmp.close();
                isProcessing = false;
            }).catch(() => { isProcessing = false; });
        }, 'image/jpeg', q);
    }

    function drawFinal(bmp) {
        const shift = parseFloat(sliders.shift.value);
        ctx.imageSmoothingEnabled = false;
        if (shift > 0) {
            drawRGBSplit(bmp, shift);
        } else {
            ctx.globalCompositeOperation = 'source-over';
            ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
        }
    }

    // Echter Kanal-Versatz: R/G/B isoliert, horizontal verschoben, additiv zusammengesetzt.
    function drawRGBSplit(bmp, shift) {
        const w = canvas.width, h = canvas.height;
        if (rgbCanvas.width !== w || rgbCanvas.height !== h) {
            rgbCanvas.width = w;
            rgbCanvas.height = h;
        }
        rgbCtx.imageSmoothingEnabled = false;

        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);
        ctx.globalCompositeOperation = 'lighter';

        const channels = [
            { color: '#ff0000', dx: shift },
            { color: '#00ff00', dx: 0 },
            { color: '#0000ff', dx: -shift }
        ];

        for (const ch of channels) {
            rgbCtx.globalCompositeOperation = 'source-over';
            rgbCtx.clearRect(0, 0, w, h);
            rgbCtx.drawImage(bmp, 0, 0, w, h);
            rgbCtx.globalCompositeOperation = 'multiply';
            rgbCtx.fillStyle = ch.color;
            rgbCtx.fillRect(0, 0, w, h);
            ctx.drawImage(rgbCanvas, ch.dx, 0);
        }

        ctx.globalCompositeOperation = 'source-over';
    }

    function loop() {
        if ((sourceMode === 'video' || sourceMode === 'webcam') && video.readyState >= 2) {
            apply();
        }
        requestAnimationFrame(loop);
    }
    loop();

    Object.keys(sliders).forEach(k => {
        sliders[k].oninput = () => {
            document.getElementById('v-' + k).textContent = sliders[k].value;
            if (sourceMode === 'image') apply();
        };
    });

    btnRec.onclick = function() {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
            this.classList.remove('recording');
            this.textContent = "Record video";
            document.getElementById('rec-ui').style.display = "none";
        } else {
            recordedChunks = [];
            let types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=h264', 'video/webm'];
            let supportedType = types.find(t => MediaRecorder.isTypeSupported(t));
            if (!supportedType) { this.textContent = 'Rec n/a'; this.disabled = true; return; }
            const streamOut = canvas.captureStream(30);
            mediaRecorder = new MediaRecorder(streamOut, { mimeType: supportedType });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const extension = supportedType.includes('mp4') ? 'mp4' : 'webm';
                const b = new Blob(recordedChunks, { type: `video/${extension}` });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(b);
                a.download = `DR_COMPRESS_${Date.now()}.${extension}`;
                a.click();
            };
            mediaRecorder.start();
            this.classList.add('recording');
            this.textContent = "Stop recording";
            document.getElementById('rec-ui').style.display = "flex";
        }
    };

    document.getElementById('btn-save').onclick = () => {
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/jpeg', 0.95);
        a.download = `DR_COMPRESS_${Date.now()}.jpg`;
        a.click();
    };

    // Init
    canvas.width = 800; canvas.height = 450;
    drawPlaceholder();
    // placeholder neu zeichnen, sobald die schrift geladen ist
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => { if (sourceMode === 'none') drawPlaceholder(); });
    }
</script>
</body>
</html>
